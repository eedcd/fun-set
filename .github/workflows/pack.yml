name: Pack Map

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install map-packer
        run: pip install map-packer

      - name: Pack map
        run: mmp pack

      - name: Resolve archive
        id: archive
        run: |
          archive="$(ls -t dist/* | head -n 1)"
          base="$(basename "$archive")"
          case "$base" in
            *.tar.gz) stem="${base%.tar.gz}" ;;
            *.tar.bz2) stem="${base%.tar.bz2}" ;;
            *.tar.xz) stem="${base%.tar.xz}" ;;
            *.*) stem="${base%.*}" ;;
            *) stem="$base" ;;
          esac
          echo "path=$archive" >> "$GITHUB_OUTPUT"
          echo "name=$stem" >> "$GITHUB_OUTPUT"
          echo "tag=$(echo "$stem" | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.archive.outputs.tag }}" \
            "${{ steps.archive.outputs.path }}" \
            --title "${{ steps.archive.outputs.name }}" \
            --notes "$(git log -1 --pretty=%B)"
